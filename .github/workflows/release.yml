name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Octavo.app
    runs-on: macos-26
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Derive version from the tag
        id: v
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "arch=$(uname -m)"
          } >> "$GITHUB_OUTPUT"
          # v0.2.0-beta1 and friends ship as pre-releases.
          case "$version" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build every product
        run: swift build -c release

      # A throwaway keychain holding only the Developer ID certificate, deleted in the last step.
      # The identity name is read back from it, so it is not a secret of its own.
      - name: Import the Developer ID certificate
        id: cert
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          : "${P12_BASE64:?DEVELOPER_ID_P12_BASE64 secret is not set}"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          : "${identity:?no Developer ID Application identity in the certificate}"
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Assemble Octavo.app
        env:
          OCTAVO_VERSION: ${{ steps.v.outputs.version }}
          OCTAVO_BUILD: ${{ github.run_number }}
          OCTAVO_SIGN_IDENTITY: ${{ steps.cert.outputs.identity }}
        run: ./Scripts/make-app.sh release

      # notarytool's exit code is not trusted on its own: the JSON status must say Accepted,
      # and anything else prints Apple's log, which names the offending file. The ticket is
      # then stapled into the bundle, so Gatekeeper passes it offline too.
      - name: Notarize and staple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          : "${ASC_KEY_P8:?ASC_KEY_P8 secret is not set}"
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          auth=(--key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID")

          ditto -c -k --keepParent build/Octavo.app "$RUNNER_TEMP/notarize.zip"
          result="$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${auth[@]}" \
            --wait --timeout 20m --output-format json)"
          echo "$result"
          id="$(echo "$result" | plutil -extract id raw -)"
          status="$(echo "$result" | plutil -extract status raw -)"
          if [[ "$status" != "Accepted" ]]; then
            xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          rm "$key"

          xcrun stapler staple build/Octavo.app

      # ditto, not zip: it is Apple's archiver for signed bundles and keeps the extended
      # attributes a signature relies on. Zipped after stapling, so the ticket ships inside.
      - name: Package
        id: pkg
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ARCH: ${{ steps.v.outputs.arch }}
        run: |
          mkdir -p dist
          app_zip="dist/Octavo-${VERSION}-macos-${ARCH}.zip"
          ditto -c -k --keepParent build/Octavo.app "$app_zip"

          bin="$(swift build -c release --show-bin-path)"
          tar -C "$bin" -czf "dist/octavo-cli-${VERSION}-macos-${ARCH}.tar.gz" \
            mtpprobe octavo-sync octavo-convert

          ( cd dist && shasum -a 256 -- * > SHA256SUMS.txt )
          ls -l dist
          echo "app_zip=$app_zip" >> "$GITHUB_OUTPUT"

      # Catches "Octavo is damaged and can't be opened" — or a Gatekeeper rejection — here
      # rather than on a user's Mac.
      - name: Verify the signature survives the round trip
        run: |
          rm -rf "$RUNNER_TEMP/verify"
          mkdir -p "$RUNNER_TEMP/verify"
          ditto -x -k "${{ steps.pkg.outputs.app_zip }}" "$RUNNER_TEMP/verify"
          app="$RUNNER_TEMP/verify/Octavo.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          plutil -lint "$app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist"

      - name: Create the GitHub release
        run: |
          gh release create "${{ steps.v.outputs.tag }}" \
            --title "Octavo ${{ steps.v.outputs.version }}" \
            --generate-notes \
            --verify-tag \
            --prerelease=${{ steps.v.outputs.prerelease }} \
            dist/*

      - name: Delete the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
